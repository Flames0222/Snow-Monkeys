modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Tectonic is not required. Hot springs find flat ground with heightmaps
# instead of fixed Y levels, so they work with its taller terrain.
[[dependencies.${mod_id}]]
    modId="tectonic"
    type="optional"
    versionRange="*"
    ordering="NONE"
    side="BOTH"
